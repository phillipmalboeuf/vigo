<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#000000" />

		<style>
			@font-face {
				font-family: 'Dolph YY';
				src: url('/fonts/DolphYYTest-Regular.otf') format('opentype');
				font-weight: normal;
				font-style: normal;
				font-display: swap;
			}

			html,
			body {
				background-color: #000;
				min-height: 100%;
				min-height: 100dvh;
			}
		</style>

		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
